name: Fetch Naukri + Adzuna jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout job-agent
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          NAUKRI_APIFY_ACTOR_ID: ${{ secrets.NAUKRI_APIFY_ACTOR_ID }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          ADZUNA_APP_ID = os.getenv("ADZUNA_APP_ID", "").strip()
          ADZUNA_APP_KEY = os.getenv("ADZUNA_APP_KEY", "").strip()
          APIFY_API_TOKEN = os.getenv("APIFY_API_TOKEN", "").strip()
          NAUKRI_APIFY_ACTOR_ID = os.getenv("NAUKRI_APIFY_ACTOR_ID", "").strip()

          required = {
              "ADZUNA_APP_ID": ADZUNA_APP_ID,
              "ADZUNA_APP_KEY": ADZUNA_APP_KEY,
              "APIFY_API_TOKEN": APIFY_API_TOKEN,
              "NAUKRI_APIFY_ACTOR_ID": NAUKRI_APIFY_ACTOR_ID,
          }

          for name, value in required.items():
              if not value:
                  raise RuntimeError(f"{name} is empty")

          SEARCHES = [
              "Flutter Developer",
              "iOS Developer",
              "Mobile Application Developer",
          ]

          LOCATIONS = [
              "Ahmedabad",
              "Bangalore",
              "Pune",
              "Hyderabad",
              "Mumbai",
              "Delhi",
              "Gurgaon",
              "Noida",
              "Chennai",
              "Remote",
          ]

          OUT = Path("data/jobs.json")
          OUT.parent.mkdir(parents=True, exist_ok=True)

          def clean(value):
              if value is None:
                  return ""
              return re.sub(r"\s+", " ", str(value)).strip()

          def arr(value):
              if isinstance(value, list):
                  return [clean(x) for x in value if clean(x)]
              if isinstance(value, str):
                  return [clean(x) for x in value.split(",") if clean(x)]
              return []

          def normalise_naukri(item):
              title = clean(
                  item.get("title")
                  or item.get("jobTitle")
                  or item.get("job_title")
              )
              company = clean(
                  item.get("companyName")
                  or item.get("company")
                  or item.get("company_name")
              )
              location = clean(item.get("location") or item.get("locations"))
              description = clean(
                  item.get("description")
                  or item.get("jobDescription")
                  or item.get("descriptionText")
              )
              url = clean(
                  item.get("jobUrl")
                  or item.get("jobURL")
                  or item.get("job_url")
                  or item.get("url")
                  or item.get("original_url")
              )
              job_id = clean(
                  item.get("jobId")
                  or item.get("jobID")
                  or item.get("job_id")
              )
              experience = clean(
                  item.get("experienceText") or item.get("experience")
              )
              posted = clean(
                  item.get("postedDate")
                  or item.get("posted_at")
                  or item.get("postedAt")
              )

              return {
                  "source": "Naukri",
                  "id": job_id or url or f"{title}|{company}|{location}",
                  "job_id": job_id,
                  "title": title,
                  "company": company,
                  "company_name": company,
                  "company_url": clean(item.get("companyUrl")),
                  "company_logo": clean(item.get("companyLogoUrl")),
                  "location": location,
                  "work_mode": clean(item.get("workMode")),
                  "experience": experience,
                  "experience_min": item.get("experienceMin"),
                  "experience_max": item.get("experienceMax"),
                  "salary": clean(item.get("salary")),
                  "salary_min": item.get("salaryMin"),
                  "salary_max": item.get("salaryMax"),
                  "salary_currency": clean(
                      item.get("salaryCurrency") or "INR"
                  ),
                  "skills": arr(item.get("skills")),
                  "description": description,
                  "employment_type": clean(
                      item.get("employmentType")
                      or item.get("employment_type")
                  ),
                  "posted_at": posted,
                  "original_url": url,
                  "redirect_url": url,
              }

          def naukri_input(keyword):
              # 'keyword' is required by the actor (this was the HTTP 400 error).
              # Open the actor's Input tab on Apify and add any other fields
              # it supports (location, max results, ...) here.
              return {
                  "keyword": keyword,
                  # "location": "India",   # enable only after checking the Input tab
                  # "maxJobs": 100,        # field name depends on the actor
              }

          def print_actor_input_schema():
              try:
                  r = requests.get(
                      f"https://api.apify.com/v2/acts/{NAUKRI_APIFY_ACTOR_ID}"
                      "/builds/default",
                      params={"token": APIFY_API_TOKEN},
                      timeout=60,
                  )
                  r.raise_for_status()
                  schema = (
                      r.json().get("data", {})
                      .get("actorDefinition", {})
                      .get("input", {})
                  )
                  print("Actor input schema:")
                  print(json.dumps(schema, indent=2)[:3000])
              except Exception as exc:
                  print(f"Could not fetch actor input schema: {exc}")

          def run_naukri_once(keyword):
              print(f"Starting Naukri scrape for: {keyword}")

              response = requests.post(
                  f"https://api.apify.com/v2/acts/{NAUKRI_APIFY_ACTOR_ID}/runs",
                  params={"token": APIFY_API_TOKEN},
                  json=naukri_input(keyword),
                  timeout=120,
              )

              if response.status_code >= 400:
                  print_actor_input_schema()
                  raise RuntimeError(
                      f"HTTP {response.status_code}: {response.text[:1000]}"
                  )

              run = response.json().get("data", {})
              run_id = run.get("id")

              if not run_id:
                  raise RuntimeError("Apify did not return a run ID")

              print(f"Apify run started: {run_id}")

              status, data = None, {}

              for _ in range(120):  # up to ~10 minutes
                  r = requests.get(
                      f"https://api.apify.com/v2/actor-runs/{run_id}",
                      params={"token": APIFY_API_TOKEN},
                      timeout=60,
                  )
                  r.raise_for_status()

                  data = r.json().get("data", {})
                  status = data.get("status")

                  if status in {"SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT"}:
                      break

                  time.sleep(5)

              if status != "SUCCEEDED":
                  raise RuntimeError(f"Apify Naukri run ended with status: {status}")

              dataset_id = data.get("defaultDatasetId")

              if not dataset_id:
                  raise RuntimeError("Apify run has no default dataset")

              items_response = requests.get(
                  f"https://api.apify.com/v2/datasets/{dataset_id}/items",
                  params={"token": APIFY_API_TOKEN, "clean": "true"},
                  timeout=120,
              )
              items_response.raise_for_status()

              raw = items_response.json()

              if not isinstance(raw, list):
                  raw = []

              # Shows the real field names so normalise_naukri() can be checked.
              if raw and isinstance(raw[0], dict):
                  print("Naukri sample item keys:", sorted(raw[0].keys()))

              jobs = [
                  normalise_naukri(item)
                  for item in raw
                  if isinstance(item, dict)
              ]

              jobs = [j for j in jobs if j.get("title") or j.get("original_url")]

              print(f"Naukri '{keyword}' returned {len(jobs)} jobs")
              return jobs

          def run_naukri():
              all_jobs = []

              # One run per search term (the actor takes a single keyword).
              for keyword in SEARCHES:
                  try:
                      all_jobs.extend(run_naukri_once(keyword))
                  except Exception as exc:
                      print(f"::warning::Naukri '{keyword}' failed: {exc}")

              print(f"Naukri total: {len(all_jobs)} jobs")
              return all_jobs

          def adzuna_search(query, location):
              print(f"Fetching Adzuna: {query} / {location}")

              url = "https://api.adzuna.com/v1/api/jobs/in/search/1"

              params = {
                  "app_id": ADZUNA_APP_ID,
                  "app_key": ADZUNA_APP_KEY,
                  "what": query,
                  "where": location,
                  "results_per_page": 50,
              }

              response = requests.get(
                  url,
                  params=params,
                  headers={"Accept": "application/json"},
                  timeout=60,
              )

              if response.status_code >= 400:
                  print(
                      f"Adzuna query failed ({query} / {location}): "
                      f"HTTP {response.status_code}: "
                      f"{response.text[:500]}"
                  )
                  return []

              data = response.json()
              results = data.get("results", [])

              jobs = []

              for item in results:
                  if not isinstance(item, dict):
                      continue

                  title = clean(item.get("title"))

                  company_data = item.get("company") or {}
                  company = (
                      clean(company_data.get("display_name"))
                      if isinstance(company_data, dict)
                      else clean(company_data)
                  )

                  loc_data = item.get("location") or {}
                  location_text = (
                      clean(loc_data.get("display_name"))
                      if isinstance(loc_data, dict)
                      else clean(loc_data)
                  )

                  description = clean(item.get("description"))
                  url_value = clean(item.get("redirect_url"))
                  job_id = clean(item.get("id"))

                  category = item.get("category") or {}
                  category_name = (
                      clean(category.get("label"))
                      if isinstance(category, dict)
                      else ""
                  )

                  jobs.append({
                      "source": "Adzuna",
                      "id": (
                          job_id
                          or url_value
                          or f"{title}|{company}|{location_text}"
                      ),
                      "job_id": job_id,
                      "title": title,
                      "company": company,
                      "company_name": company,
                      "company_url": "",
                      "company_logo": "",
                      "location": location_text or location,
                      "work_mode": "",
                      "experience": "",
                      "experience_min": None,
                      "experience_max": None,
                      "salary": (
                          clean(item.get("salary_min"))
                          if item.get("salary_min")
                          else ""
                      ),
                      "salary_min": item.get("salary_min"),
                      "salary_max": item.get("salary_max"),
                      "salary_currency": "INR",
                      "skills": [],
                      "description": description,
                      "employment_type": "",
                      "category": category_name,
                      "posted_at": clean(item.get("created")),
                      "original_url": url_value,
                      "redirect_url": url_value,
                  })

              return jobs

          naukri_jobs = []

          try:
              naukri_jobs = run_naukri()
          except Exception as exc:
              print(f"::warning::Naukri scrape failed: {exc}")

          adzuna_jobs = []

          for query in SEARCHES:
              for location in LOCATIONS:
                  adzuna_jobs.extend(adzuna_search(query, location))

          print(f"Adzuna jobs before dedupe: {len(adzuna_jobs)}")

          all_jobs = naukri_jobs + adzuna_jobs

          deduped = []
          seen = set()

          for job in all_jobs:
              key = clean(
                  job.get("id")
                  or job.get("original_url")
                  or (
                      f"{job.get('title')}|"
                      f"{job.get('company')}|"
                      f"{job.get('location')}"
                  )
              ).lower()

              if not key or key in seen:
                  continue

              seen.add(key)
              deduped.append(job)

          if not deduped:
              raise RuntimeError(
                  "Both Naukri and Adzuna returned 0 jobs. "
                  "Refusing to overwrite data/jobs.json."
              )

          previous = []

          if OUT.exists():
              try:
                  old = json.loads(OUT.read_text(encoding="utf-8"))
                  previous = (
                      old.get("jobs", [])
                      if isinstance(old, dict)
                      else old
                  )
                  if not isinstance(previous, list):
                      previous = []
              except Exception:
                  previous = []

          previous_keys = {
              clean(
                  item.get("id")
                  or item.get("job_id")
                  or item.get("original_url")
              ).lower()
              for item in previous
              if isinstance(item, dict)
          }

          new_jobs = [
              item
              for item in deduped
              if clean(
                  item.get("id")
                  or item.get("job_id")
                  or item.get("original_url")
              ).lower()
              not in previous_keys
          ]

          now = datetime.now(timezone.utc).isoformat()

          payload = {
              "jobs": deduped,
              "meta": {
                  "collected_jobs": len(all_jobs),
                  "unique_jobs": len(deduped),
                  "new_jobs": len(new_jobs),
                  "saved_matches": len(deduped),
                  "last_run_utc": now,
                  "updated_at": now,
                  "sources": {
                      "Naukri": len(naukri_jobs),
                      "Adzuna": len(adzuna_jobs),
                  },
              },
          }

          OUT.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(
              f"Final jobs: {len(deduped)} "
              f"(Naukri: {len(naukri_jobs)}, "
              f"Adzuna: {len(adzuna_jobs)})"
          )
          print(f"Done. Wrote {len(deduped)} jobs to {OUT}")
          PY

      - name: Validate generated jobs
        run: |
          python - <<'PY'
          import json

          with open("data/jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          jobs = data.get("jobs", data)

          if not isinstance(jobs, list):
              raise SystemExit(
                  "jobs.json does not contain a jobs array"
              )

          if not jobs:
              raise SystemExit("jobs.json contains zero jobs")

          print(f"Validated jobs.json: {len(jobs)} jobs")
          PY

      - name: Commit generated data to job-agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No changes to jobs.json"
          else
            git commit -m "chore: update job data"
            git push
          fi

      - name: Publish jobs.json to dashboard repository
        env:
          DASHBOARD_REPO_TOKEN: ${{ secrets.DASHBOARD_REPO_TOKEN }}
        run: |
          if [ -z "$DASHBOARD_REPO_TOKEN" ]; then
            echo "DASHBOARD_REPO_TOKEN is empty"
            exit 1
          fi

          git clone \
            "https://x-access-token:${DASHBOARD_REPO_TOKEN}@github.com/kuldeep13990/job-agent-dashboard.git" \
            dashboard

          mkdir -p dashboard/data
          cp data/jobs.json dashboard/data/jobs.json

          cd dashboard

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "Dashboard jobs.json is already up to date"
          else
            git commit -m "chore: update job data"
            git push origin main
          fi
