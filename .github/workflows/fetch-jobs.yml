name: Fetch Jobs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Naukri + Adzuna jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          NAUKRI_APIFY_ACTOR_ID: ${{ secrets.NAUKRI_APIFY_ACTOR_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          ADZUNA_QUERIES = [
              "Flutter Developer",
              "iOS Developer",
              "Mobile Application Developer",
          ]

          OUTPUT = Path("data/jobs.json")
          OUTPUT.parent.mkdir(exist_ok=True)

          def http_json(url, method="GET", payload=None, headers=None, timeout=120):
              request_headers = {
                  "User-Agent": "job-agent-dashboard/1.0",
                  "Accept": "application/json",
              }
              if headers:
                  request_headers.update(headers)

              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  request_headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=request_headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"HTTP {exc.code}: {body[:1000]}"
                  ) from exc

          def clean_html(value):
              if not value:
                  return ""
              text = re.sub(r"<[^>]+>", " ", str(value))
              text = re.sub(r"\s+", " ", text)
              return text.strip()

          def normalize_naukri(job):
              return {
                  "source": "Naukri",
                  "jobId": str(job.get("jobId") or ""),
                  "title": job.get("title") or "",
                  "companyName": job.get("companyName") or "",
                  "companyUrl": job.get("companyUrl"),
                  "companyLogoUrl": job.get("companyLogoUrl"),
                  "location": job.get("location") or "",
                  "workMode": job.get("workMode"),
                  "experienceText": job.get("experienceText") or "",
                  "experienceMin": job.get("experienceMin"),
                  "experienceMax": job.get("experienceMax"),
                  "salary": job.get("salary"),
                  "salaryMin": job.get("salaryMin"),
                  "salaryMax": job.get("salaryMax"),
                  "salaryCurrency": job.get("salaryCurrency") or "INR",
                  "skills": job.get("skills") or [],
                  "jobDescription": clean_html(job.get("jobDescription")),
                  "postedDate": job.get("postedDate"),
                  "postedDateRelative": job.get("postedDateRelative"),
                  "jobUrl": job.get("jobUrl") or "",
                  "companyRating": job.get("companyRating"),
                  "companyReviewsCount": job.get("companyReviewsCount"),
                  "sourceKeyword": job.get("keyword"),
                  "sourceLocation": job.get("locationSearched"),
                  "scrapedAt": job.get("scrapedAt"),
              }

          def normalize_adzuna(job):
              location = job.get("location") or {}
              company = job.get("company") or {}

              return {
                  "source": "Adzuna",
                  "jobId": str(job.get("id") or ""),
                  "title": job.get("title") or "",
                  "companyName": company.get("display_name") or "",
                  "companyUrl": None,
                  "companyLogoUrl": None,
                  "location": location.get("display_name") or "",
                  "workMode": None,
                  "experienceText": "",
                  "experienceMin": None,
                  "experienceMax": None,
                  "salary": job.get("salary_min"),
                  "salaryMin": job.get("salary_min"),
                  "salaryMax": job.get("salary_max"),
                  "salaryCurrency": "INR",
                  "skills": [],
                  "jobDescription": clean_html(job.get("description")),
                  "postedDate": job.get("created"),
                  "postedDateRelative": None,
                  "jobUrl": job.get("redirect_url") or "",
                  "companyRating": None,
                  "companyReviewsCount": None,
                  "sourceKeyword": job.get("_search_query"),
                  "sourceLocation": job.get("_search_location"),
                  "scrapedAt": datetime.now(timezone.utc).isoformat(),
              }

          # ------------------------------------------------------------
          # Naukri
          #
          # IMPORTANT:
          # We intentionally do not send guessed input field names here.
          # The Naukri Actor already has the working search configuration
          # that was tested successfully in Apify. Running the Actor
          # without an input uses that configured/default input.
          # ------------------------------------------------------------
          apify_token = os.environ["APIFY_API_TOKEN"]
          actor_id = os.environ["NAUKRI_APIFY_ACTOR_ID"]

          actor_id_encoded = urllib.parse.quote(actor_id, safe="")
          naukri_url = (
              f"https://api.apify.com/v2/actors/{actor_id_encoded}"
              "/run-sync-get-dataset-items"
              "?format=json"
          )

          print("Starting Naukri scrape...")
          try:
              naukri_raw = http_json(
                  naukri_url,
                  method="GET",
                  headers={"Authorization": f"Bearer {apify_token}"},
                  timeout=300,
              )

              if not isinstance(naukri_raw, list):
                  raise RuntimeError(
                      "Unexpected Naukri response; expected a JSON array."
                  )

              naukri_jobs = [
                  normalize_naukri(x)
                  for x in naukri_raw
                  if isinstance(x, dict)
              ]

              print(f"Naukri jobs: {len(naukri_jobs)}")

              if not naukri_jobs:
                  raise RuntimeError("Naukri Actor completed but returned 0 jobs.")

          except Exception as exc:
              print(f"Naukri scrape failed: {exc}", file=sys.stderr)
              naukri_jobs = []

          # ------------------------------------------------------------
          # Adzuna
          # ------------------------------------------------------------
          app_id = os.environ["ADZUNA_APP_ID"]
          app_key = os.environ["ADZUNA_APP_KEY"]

          adzuna_jobs = []

          for query in ADZUNA_QUERIES:
              params = urllib.parse.urlencode({
                  "app_id": app_id,
                  "app_key": app_key,
                  "results_per_page": 50,
                  "what": query,
                  "where": "India",
              })

              url = (
                  "https://api.adzuna.com/v1/api/jobs/in/search/1?"
                  + params
              )

              print(f"Fetching Adzuna: {query}")

              try:
                  result = http_json(
                      url,
                      headers={"Accept": "application/json"},
                      timeout=120,
                  )

                  if not isinstance(result, dict):
                      raise RuntimeError("Unexpected Adzuna response.")

                  for item in result.get("results", []):
                      item["_search_query"] = query
                      item["_search_location"] = "India"
                      adzuna_jobs.append(normalize_adzuna(item))

              except Exception as exc:
                  print(
                      f"Adzuna query failed ({query}): {exc}",
                      file=sys.stderr,
                  )

          print(f"Adzuna jobs before dedupe: {len(adzuna_jobs)}")

          # Do not silently publish an empty result if every source failed.
          if not naukri_jobs and not adzuna_jobs:
              raise RuntimeError(
                  "Both Naukri and Adzuna returned 0 jobs. "
                  "Refusing to overwrite data/jobs.json."
              )

          # ------------------------------------------------------------
          # Merge + deduplicate
          # ------------------------------------------------------------
          incoming = naukri_jobs + adzuna_jobs

          existing = []
          if OUTPUT.exists():
              try:
                  old = json.loads(OUTPUT.read_text(encoding="utf-8"))
                  if isinstance(old, list):
                      existing = old
                  elif isinstance(old, dict) and isinstance(old.get("jobs"), list):
                      existing = old["jobs"]
              except Exception as exc:
                  print(f"Could not read existing jobs.json: {exc}")

          def job_key(job):
              return (
                  job.get("jobUrl")
                  or f'{job.get("source","")}:{job.get("jobId","")}'
                  or (
                      f'{job.get("companyName","")}:'
                      f'{job.get("title","")}:'
                      f'{job.get("location","")}'
                  )
              )

          fresh_keys = {job_key(job) for job in incoming if job_key(job)}

          merged = list(incoming)

          # Preserve older records that are not part of the fresh result.
          for job in existing:
              key = job_key(job)
              if key and key not in fresh_keys:
                  merged.append(job)

          unique = []
          seen = set()

          for job in merged:
              key = job_key(job)
              if not key or key in seen:
                  continue
              seen.add(key)
              unique.append(job)

          unique.sort(
              key=lambda x: x.get("postedDate") or "",
              reverse=True,
          )

          OUTPUT.write_text(
              json.dumps(unique, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(
              f"Done. Wrote {len(unique)} jobs to {OUTPUT} "
              f"({len(naukri_jobs)} Naukri + "
              f"{len(adzuna_jobs)} Adzuna fresh records)."
          )
          PY

      - name: Commit updated job data
        run: |
          git config user.name "job-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No job-data changes to commit."
          else
            git commit -m "chore: update job listings"
            git push
          fi
