name: Fetch Naukri + Adzuna Jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DASHBOARD_REPO_TOKEN }}
          fetch-depth: 0

      - name: Fetch Naukri + Adzuna jobs
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          NAUKRI_APIFY_ACTOR_ID: ${{ secrets.NAUKRI_APIFY_ACTOR_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          NAUKRI_KEYWORDS = (
              '"Senior iOS Developer","Senior Flutter Developer",'
              '"Senior Mobile Application Developer","iOS Flutter Developer",'
              '"Lead iOS Developer","Lead Mobile Application Developer",'
              '"Senior Mobile App Developer"'
          )

          NAUKRI_LOCATIONS = (
              '"Ahmedabad","Bangalore","Pune","Hyderabad","Mumbai",'
              '"Delhi","Gurgaon","Noida","Chennai","Remote"'
          )

          ADZUNA_KEYWORDS = [
              "Flutter Developer",
              "iOS Developer",
              "Mobile Application Developer",
          ]

          ADZUNA_LOCATIONS = [
              "Ahmedabad",
              "Bangalore",
              "Pune",
              "Hyderabad",
              "Mumbai",
              "Delhi",
              "Gurgaon",
              "Noida",
              "Chennai",
              "Remote",
          ]

          def http_json(url, method="GET", body=None, headers=None):
              headers = dict(headers or {})
              data = None

              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      raw = response.read().decode("utf-8")
                      return json.loads(raw)

              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  # Never print credentials from the URL/body.
                  raise RuntimeError(
                      f"HTTP {exc.code}: {raw[:1200]}"
                  ) from None

          def fetch_naukri():
              token = os.environ["APIFY_API_TOKEN"]
              actor_id = os.environ["NAUKRI_APIFY_ACTOR_ID"].strip()

              if not actor_id:
                  raise RuntimeError("NAUKRI_APIFY_ACTOR_ID is empty")

              # These are the same values used successfully in the
              # Apify Actor UI.
              actor_input = {
                  "keyword": NAUKRI_KEYWORDS,
                  "location": NAUKRI_LOCATIONS,
              }

              encoded_actor_id = urllib.parse.quote(actor_id, safe="~")

              url = (
                  "https://api.apify.com/v2/actors/"
                  f"{encoded_actor_id}/run-sync-get-dataset-items"
                  "?format=json&clean=true"
              )

              print("Starting Naukri scrape...")
              print(f"Using Apify Actor ID: {actor_id}")

              result = http_json(
                  url,
                  method="POST",
                  body=actor_input,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
              )

              if not isinstance(result, list):
                  raise RuntimeError(
                      "Apify returned an unexpected response; "
                      "expected a dataset item array."
                  )

              print(f"Naukri returned {len(result)} jobs")

              jobs = []

              for job in result:
                  jobs.append({
                      "source": "Naukri",
                      "jobId": job.get("jobId"),
                      "title": job.get("title"),
                      "companyName": job.get("companyName"),
                      "companyUrl": job.get("companyUrl"),
                      "companyLogoUrl": job.get("companyLogoUrl"),
                      "location": job.get("location"),
                      "workMode": job.get("workMode"),
                      "experienceText": job.get("experienceText"),
                      "experienceMin": job.get("experienceMin"),
                      "experienceMax": job.get("experienceMax"),
                      "salary": job.get("salary"),
                      "salaryMin": job.get("salaryMin"),
                      "salaryMax": job.get("salaryMax"),
                      "salaryCurrency": job.get("salaryCurrency"),
                      "skills": job.get("skills") or [],
                      "jobDescription": job.get("jobDescription"),
                      "postedDate": job.get("postedDate"),
                      "postedDateRelative": job.get("postedDateRelative"),
                      "applyByDate": job.get("applyByDate"),
                      "jobUrl": job.get("jobUrl"),
                      "vacancy": job.get("vacancy"),
                      "companyRating": job.get("companyRating"),
                      "companyReviewsCount": job.get("companyReviewsCount"),
                      "ambitionBoxUrl": job.get("ambitionBoxUrl"),
                      "scrapedAt": job.get("scrapedAt"),
                  })

              return jobs

          def fetch_adzuna():
              app_id = os.environ["ADZUNA_APP_ID"].strip()
              app_key = os.environ["ADZUNA_APP_KEY"].strip()

              if not app_id:
                  raise RuntimeError("ADZUNA_APP_ID is empty")

              if not app_key:
                  raise RuntimeError("ADZUNA_APP_KEY is empty")

              jobs = []

              for keyword in ADZUNA_KEYWORDS:
                  for location in ADZUNA_LOCATIONS:
                      print(f"Fetching Adzuna: {keyword} / {location}")

                      params = {
                          "app_id": app_id,
                          "app_key": app_key,
                          "results_per_page": "20",
                          "what": keyword,
                          "where": location,
                          "sort_by": "date",
                          "content-type": "application/json",
                      }

                      url = (
                          "https://api.adzuna.com/v1/api/jobs/in/search/1?"
                          + urllib.parse.urlencode(params)
                      )

                      try:
                          data = http_json(
                              url,
                              headers={"Accept": "application/json"},
                          )

                          results = data.get("results") or []

                          for job in results:
                              company = job.get("company") or {}
                              location_data = job.get("location") or {}

                              jobs.append({
                                  "source": "Adzuna",
                                  "jobId": str(job.get("id") or ""),
                                  "title": job.get("title"),
                                  "companyName": company.get("display_name"),
                                  "companyUrl": None,
                                  "companyLogoUrl": None,
                                  "location": location_data.get("display_name"),
                                  "workMode": None,
                                  "experienceText": None,
                                  "experienceMin": None,
                                  "experienceMax": None,
                                  "salary": None,
                                  "salaryMin": job.get("salary_min"),
                                  "salaryMax": job.get("salary_max"),
                                  "salaryCurrency": "INR",
                                  "skills": [],
                                  "jobDescription": job.get("description"),
                                  "postedDate": job.get("created"),
                                  "postedDateRelative": None,
                                  "applyByDate": None,
                                  "jobUrl": job.get("redirect_url"),
                                  "vacancy": None,
                                  "companyRating": None,
                                  "companyReviewsCount": None,
                                  "ambitionBoxUrl": None,
                                  "scrapedAt": None,
                              })

                      except Exception as exc:
                          print(
                              f"Adzuna query failed "
                              f"({keyword} / {location}): {exc}"
                          )

              print(f"Adzuna jobs before dedupe: {len(jobs)}")
              return jobs

          def clean_key(value):
              return (
                  str(value or "")
                  .lower()
                  .strip()
                  .replace(" ", "")
                  .replace("-", "")
                  .replace("_", "")
              )

          def dedupe(jobs):
              seen = set()
              unique = []

              for job in jobs:
                  url = (job.get("jobUrl") or "").strip().lower()

                  if url:
                      key = "url:" + url
                  else:
                      key = "|".join([
                          clean_key(job.get("source")),
                          clean_key(job.get("companyName")),
                          clean_key(job.get("title")),
                          clean_key(job.get("location")),
                      ])

                  if key in seen:
                      continue

                  seen.add(key)
                  unique.append(job)

              return unique

          naukri_jobs = []
          adzuna_jobs = []

          try:
              naukri_jobs = fetch_naukri()
          except Exception as exc:
              print(f"Naukri scrape failed: {exc}")

          try:
              adzuna_jobs = fetch_adzuna()
          except Exception as exc:
              print(f"Adzuna scrape failed: {exc}")

          all_jobs = dedupe(naukri_jobs + adzuna_jobs)

          print(
              f"Final jobs: {len(all_jobs)} "
              f"(Naukri: {len(naukri_jobs)}, "
              f"Adzuna: {len(adzuna_jobs)})"
          )

          # Safety: never replace good existing data with an empty file.
          if not all_jobs:
              raise RuntimeError(
                  "Both Naukri and Adzuna returned 0 jobs. "
                  "Refusing to overwrite data/jobs.json."
              )

          os.makedirs("data", exist_ok=True)

          with open("data/jobs.json", "w", encoding="utf-8") as file:
              json.dump(
                  all_jobs,
                  file,
                  indent=2,
                  ensure_ascii=False,
              )

          print(f"Done. Wrote {len(all_jobs)} jobs to data/jobs.json")
          PY

      - name: Commit and push job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No changes to job data."
          else
            git commit -m "chore: update job listings"
            git push origin main
          fi
